version: "3.9"

services:
  reflexion-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reflexion-code-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist reflection memory across container restarts
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
